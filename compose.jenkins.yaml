services:

  jenkins:
    build:
      context: ./jenkins

    container_name: devops-jenkins

    user: root

    ports:
      - "8082:8080"
      - "50000:50000"

    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace

    restart: unless-stopped


volumes:
  jenkins-data: