<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IT Helpdesk</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #222;
            color: white;
        }

        .error {
            background: #ffdede;
            padding: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>

<h1>IT Helpdesk</h1>

<div class="subtitle">
    DevOps Helpdesk V1
</div>

<div id="error"></div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Problem</th>
            <th>Priority</th>
            <th>Status</th>
        </tr>
    </thead>

    <tbody id="tickets"></tbody>
</table>

<script>
async function loadTickets() {
    try {
        const response = await fetch("/api/tickets");

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const tickets = await response.json();

        const table = document.getElementById("tickets");

        tickets.forEach(ticket => {
            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${ticket.id}</td>
                <td>${ticket.title}</td>
                <td>${ticket.priority}</td>
                <td>${ticket.status}</td>
            `;

            table.appendChild(row);
        });

    } catch (error) {
        document.getElementById("error").innerHTML = `
            <div class="error">
                Gagal mengambil data: ${error.message}
            </div>
        `;
    }
}

loadTickets();
</script>

</body>
</html>
